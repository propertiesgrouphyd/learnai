
name: VIDHWAAN AIVidhya Github DEPLOY

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vidhwaan-vidhyai-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PROJECT_NAME: vidhwaan-vidhyai

    steps:
      # CHECKOUT
      - name: Checkout Repository
        uses: actions/checkout@v4

      # NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # INSTALL TOOLS
      - name: Install Production Tools
        run: |
          npm install -g terser javascript-obfuscator clean-css-cli html-minifier-terser

      # VALIDATE SOURCE
      - name: Validate Application
        env:
          AIVIDHYA_DATA_KEY: ${{ secrets.AIVIDHYA_DATA_KEY }}
        run: |
          set -euo pipefail

          node --check app.js
          node --check sw.js
          node --check scripts/protect-data.js

          npm run validate

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const key = process.env.AIVIDHYA_DATA_KEY;

          if (!key || !/^[A-Za-z0-9+/]+={0,2}$/.test(key)) {
            throw new Error("AIVIDHYA_DATA_KEY is missing or invalid Base64.");
          }

          if (Buffer.from(key, "base64").length !== 32) {
            throw new Error("AIVIDHYA_DATA_KEY must decode to 32 bytes.");
          }

          const required = [
            "index.html",
            "main.css",
            "app.js",
            "sw.js",
            "manifest.json",
            "favicon.ico",
            "icons/logo.png",
            "icons/icon-192.png",
            "icons/icon-512.png",
            "scripts/protect-data.js",
            "data/credentials.json"
          ];

          for (const file of required) {
            if (!fs.existsSync(file)) {
              throw new Error(`Missing required file: ${file}`);
            }
          }

          const lessons = fs.readdirSync("data")
            .filter(f => /^day-\d{3}\.json$/.test(f));

          if (!lessons.length) {
            throw new Error("No day-XXX.json lesson files found.");
          }

          const credentials = JSON.parse(
            fs.readFileSync("data/credentials.json", "utf8")
          );

          if (!Array.isArray(credentials.users) || !credentials.users.length) {
            throw new Error("credentials.json must contain users.");
          }

          console.log(`Source validation passed: ${lessons.length} lessons.`);
          console.log(`Login users: ${credentials.users.length}`);
          NODE

      # PREPARE DIST
      - name: Prepare Dist
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/data

          cp index.html dist/
          cp main.css dist/
          cp app.js dist/
          cp sw.js dist/
          cp manifest.json dist/
          cp favicon.ico dist/
          cp -r icons dist/

          if [ -f CNAME ]; then
            cp CNAME dist/
          fi

      # PROTECT LESSONS AND LOGIN CREDENTIALS
      - name: Protect Lesson and Credential Data
        env:
          AIVIDHYA_DATA_KEY: ${{ secrets.AIVIDHYA_DATA_KEY }}
        run: |
          set -euo pipefail

          node scripts/protect-data.js

          test -f dist/data/credentials.dat

      # INJECT DECRYPTION KEY
      - name: Inject Decryption Key
        env:
          AIVIDHYA_DATA_KEY: ${{ secrets.AIVIDHYA_DATA_KEY }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/app.js";
          const key = process.env.AIVIDHYA_DATA_KEY;
          const placeholder = "__AIVIDHYA_DATA_KEY__";

          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(key)) {
            throw new Error("Invalid Base64 encryption key.");
          }

          if (Buffer.from(key, "base64").length !== 32) {
            throw new Error("Encryption key must decode to 32 bytes.");
          }

          const source = fs.readFileSync(file, "utf8");
          const count = source.split(placeholder).length - 1;

          if (count !== 1) {
            throw new Error(`Expected one key placeholder, found ${count}.`);
          }

          const updated = source.replace(
            `"${placeholder}"`,
            JSON.stringify(key)
          );

          fs.writeFileSync(file, updated, "utf8");

          if (updated.includes(placeholder)) {
            throw new Error("Key placeholder replacement failed.");
          }

          console.log("AIVidhya decryption key injected.");
          NODE

          node --check dist/app.js

      # MINIFY HTML
      - name: Minify HTML
        run: |
          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            dist/index.html \
            -o dist/index.html

      # HTML SINGLE LINE
      - name: Make HTML Single Line
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/index.html";

          fs.writeFileSync(
            file,
            fs.readFileSync(file, "utf8").replace(/[\r\n]/g, "").trim()
          );
          NODE

      # MINIFY CSS
      - name: Minify CSS
        run: |
          cleancss -O2 dist/main.css -o dist/main.css

      # CSS SINGLE LINE
      - name: Make CSS Single Line
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/main.css";

          fs.writeFileSync(
            file,
            fs.readFileSync(file, "utf8").replace(/[\r\n]/g, "").trim()
          );
          NODE

      # MINIFY JAVASCRIPT
      - name: Minify JavaScript
        run: |
          terser dist/app.js \
            --compress \
            --mangle \
            -o dist/app.js

      # OBFUSCATE JAVASCRIPT
      - name: Obfuscate JavaScript
        run: |
          javascript-obfuscator dist/app.js \
            --output dist/app.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.2 \
            --disable-console-output true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --self-defending true \
            --split-strings true \
            --string-array true \
            --string-array-encoding base64

      # VERIFY KEY
      - name: Verify Decryption Key
        run: |
          set -euo pipefail

          if grep -Fq '__AIVIDHYA_DATA_KEY__' dist/app.js; then
            echo "ERROR: Key placeholder remains."
            exit 1
          fi

          echo "Decryption key injection passed."

      # CACHE VERSION
      - name: Generate Asset Version
        run: |
          VERSION=$(date +%s)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Asset version: $VERSION"

      # CACHE BUST
      - name: Apply Asset Cache Busting
        run: |
          set -euo pipefail

          sed -i "s|href=\"./main.css\"|href=\"./main.css?v=$VERSION\"|g" dist/index.html
          sed -i "s|src=\"./app.js\"|src=\"./app.js?v=$VERSION\"|g" dist/index.html
          sed -i "s|href=\"./manifest.json\"|href=\"./manifest.json?v=$VERSION\"|g" dist/index.html

      # VERIFY HTML CSS
      - name: Verify HTML and CSS
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          for (const file of ["dist/index.html", "dist/main.css"]) {
            const content = fs.readFileSync(file, "utf8");

            if (/[\r\n]/.test(content)) {
              throw new Error(`${file} is not single-line.`);
            }

            console.log(`Single-line verified: ${file}`);
          }
          NODE

      # VERIFY PRODUCTION BUILD
      - name: Verify Production Build
        run: |
          set -euo pipefail

          SOURCE_COUNT=$(find data -maxdepth 1 -type f -name 'day-*.json' | wc -l)

          LESSON_DAT_COUNT=$(find dist/data -maxdepth 1 -type f -name 'day-*.dat' | wc -l)

          TOTAL_DAT_COUNT=$(find dist/data -maxdepth 1 -type f -name '*.dat' | wc -l)

          JSON_COUNT=$(find dist/data -maxdepth 1 -type f -name '*.json' | wc -l)

          echo "Source lessons       : $SOURCE_COUNT"
          echo "Protected lessons    : $LESSON_DAT_COUNT"
          echo "Total protected DAT  : $TOTAL_DAT_COUNT"
          echo "Plain JSON           : $JSON_COUNT"

          test "$LESSON_DAT_COUNT" -eq "$SOURCE_COUNT"
          test "$TOTAL_DAT_COUNT" -eq "$((SOURCE_COUNT + 1))"
          test "$JSON_COUNT" -eq 0
          test -f dist/data/credentials.dat

          for file in \
            dist/index.html \
            dist/main.css \
            dist/app.js \
            dist/sw.js \
            dist/manifest.json \
            dist/favicon.ico \
            dist/icons/logo.png \
            dist/icons/icon-192.png \
            dist/icons/icon-512.png
          do
            test -f "$file"
          done

          echo "Production verification passed."

          echo
          echo "PROTECTED FILES:"
          ls -lh dist/data/*.dat

          echo
          echo "BUILD SIZE:"
          du -sh dist

      # CONFIGURE PAGES
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # UPLOAD
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # DEPLOY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # SUCCESS
      - name: Deployment Success
        run: |
          echo "=============================================="
          echo " VIDHWAAN AIVIDHYA DEPLOYMENT SUCCESS"
          echo "=============================================="
          echo "Project : $PROJECT_NAME"
          echo "Version : $VERSION"
          echo "✓ Login credentials AES-256-GCM protected"
          echo "✓ Lessons AES-256-GCM protected"
          echo "✓ credentials.dat deployed"
          echo "✓ Plain JSON excluded from dist"
          echo "✓ HTML/CSS single-line"
          echo "✓ JavaScript minified and obfuscated"
          echo "✓ PWA deployment completed"
          echo "=============================================="
